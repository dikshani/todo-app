---
- name: Setup Docker on Existing AWS EC2
  hosts: servers
  become: yes

  tasks:
    - name: Update apt cache
      apt: 
        update_cache: yes

    - name: Install required dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Create keyrings directory
      file: 
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Get system architecture
      command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Get OS release codename
      command: lsb_release -cs
      register: lsb_codename
      changed_when: false

    - name: Add Docker Repository
      apt_repository:
        repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ lsb_codename.stdout }} stable"
        state: present
        filename: docker

    - name: Install docker and Docker compose plugin
      apt: 
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user: 
        name: ubuntu
        groups: docker
        append: yes
