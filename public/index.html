<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibrant Todo App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #2b2650;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: #7b7482;
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
      color: #7d1128;
      font-size: 2rem;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      outline: none;
    }

    button.add-btn {
      background-color: #198754;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.add-btn:hover {
      background-color: #157347;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #ffffff;
      color: #333;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .delete-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background-color: #bb2d3b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚀 My Todo Tasks</h1>
    
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Enter new task..." />
      <button class="add-btn" id="addBtn">Add Task</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script>
    const API_URL = '/api/tasks';

    // 1. Fetch & Display All Tasks
    async function fetchTasks() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('Failed to fetch tasks');
        const tasks = await response.json();

        const taskList = document.getElementById('taskList');
        taskList.innerHTML = '';

        tasks.forEach(task => {
          const li = document.createElement('li');
          li.innerHTML = `
            <span>${task.title}</span>
            <button class="delete-btn" onclick="deleteTask('${task._id}')">Delete</button>
          `;
          taskList.appendChild(li);
        });
      } catch (err) {
        console.error('Error loading tasks:', err);
      }
    }

    // 2. Add Task Function
    async function addTask() {
      const input = document.getElementById('taskInput');
      const title = input.value.trim();

      if (!title) {
        alert('Please enter a task!');
        return;
      }

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ title: title })
        });

        if (response.ok) {
          input.value = '';
          fetchTasks(); // Reload task list
        } else {
          alert('Task save nahi ho gaya server par.');
        }
      } catch (err) {
        console.error('Save task error:', err);
        alert('Task save nahi ho gaya server par.');
      }
    }

    // 3. Delete Task Function
    async function deleteTask(id) {
      try {
        const response = await fetch(`${API_URL}/${id}`, {
          method: 'DELETE'
        });

        if (response.ok) {
          fetchTasks();
        } else {
          alert('Failed to delete task.');
        }
      } catch (err) {
        console.error('Delete task error:', err);
      }
    }

    // Event Listener for Button Click
    document.getElementById('addBtn').addEventListener('click', addTask);

    // Initial Fetch on Load
    fetchTasks();
  </script>
</body>
</html>
