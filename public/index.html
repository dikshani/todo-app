<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibrant Todo App</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 30px; width: 100%; max-width: 480px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2); }
    h1 { text-align: center; color: #ff416c; font-size: 2rem; margin-bottom: 20px; }
    .input-box { display: flex; gap: 10px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; outline: none; }
    button.add-btn { background: #38ef7d; border: none; color: white; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .todo-list { list-style: none; }
    .todo-item { background: #f8fafc; padding: 12px 16px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-left: 5px solid #764ba2; }
    .delete-btn { background: #ff4757; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚀 My Todo Tasks</h1>
    
    <div class="input-box">
      <input type="text" id="todoInput" placeholder="Add a colorful new task..." onkeydown="if(event.key==='Enter') addTodo()" />
      <button class="add-btn" onclick="addTodo()">Add Task</button>
    </div>

    <ul class="todo-list" id="todoList"></ul>
  </div>

  <script>
   
   const API_URL = '/todos';

   async function fetchTodos() {
      try {
        const res = await fetch('/api/todos');
        const todos = await res.json();
        const list = document.getElementById('todoList');
        list.innerHTML = '';
        todos.forEach(todo => {
          const li = document.createElement('li');
          li.className = 'todo-item';
          li.innerHTML = `
            <span>${todo.text}</span>
            <button class="delete-btn" onclick="deleteTodo('${todo._id}')">Delete</button>
          `;
          list.appendChild(li);
        });
      } catch (err) {
        console.error('Fetch Error:', err);
      }
    }

    async function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      if (!text) {
        alert("Pehle task text type karein!");
        return;
      }

      try {
        const res = await fetch('/api/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        
        if (res.ok) {
          input.value = '';
          fetchTodos();
        } else {
          alert("Task save nahi ho paya server par.");
        }
      } catch (err) {
        console.error('Add Error:', err);
        alert("Server network error!");
      }
    }

    async function deleteTodo(id) {
      try {
        await fetch('/api/todos/' + id, { method: 'DELETE' });
        fetchTodos();
      } catch (err) {
        console.error('Delete Error:', err);
      }
    }

    // Load initial list
    fetchTodos();
  </script>

</body>
</html>
